// 仅在当前Android Library模块中执行
if (plugins.hasPlugin('com.android.library')) {
    // 应用必要插件
    apply plugin: "com.vanniktech.maven.publish"

    mavenPublishing {
        coordinates("io.github.sy007", "calendar-view", "1.2.2")
        pom {
            name = "calendar-view"
            description = "android custom calendar-veiw"
            url = "https://github.com/sy007/CalendarView/"
            licenses {
                license {
                    name = "The Apache Software License, Version 2.0"
                    url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                }
            }
            developers {
                developer {
                    id = "sy007"
                    name = "sy007"
                    email = "547616310@qq.com"
                }
            }
            scm {
                connection = "scm:git:github.com/sy007/CalendarView.git"
                developerConnection = "scm:git:ssh://github.com/sy007/CalendarView.git"
                url = "https://github.com/sy007/CalendarView/"
            }
        }
        publishToMavenCentral()
        signAllPublications()
    }
} else {
    println "publish.gradle 仅适用于Android Library模块（需应用com.android.library插件）"
}